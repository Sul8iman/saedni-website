<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ساعدني</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Noto Sans Arabic', system-ui, sans-serif;
      background: #F6F8F7;
      color: #1A1A1A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      font-size: 3rem;
      font-weight: 800;
      color: #1AA87D;
      margin-bottom: 12px;
    }
    .tagline {
      font-size: 1.1rem;
      color: #6B7280;
      margin-bottom: 40px;
    }
    .links {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
      max-width: 300px;
    }
    .links a {
      display: block;
      padding: 14px 24px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: opacity 0.2s;
    }
    .links a:hover { opacity: 0.85; }
    .btn-primary {
      background: #1AA87D;
      color: #fff;
    }
    .btn-secondary {
      background: #fff;
      color: #374151;
      border: 1px solid #E5E7EB;
    }
    footer {
      margin-top: 48px;
      font-size: 0.8rem;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="logo">ساعدني</div>
  <p class="tagline">منصة تربط من يحتاج المساعدة بمن يقدّمها</p>
  <nav class="links">
    <a class="btn-primary" href="privacy/">سياسة الخصوصية</a>
    <a class="btn-secondary" href="delete-account/">حذف الحساب</a>
  </nav>
  <footer>© ٢٠٢٥ ساعدني – جميع الحقوق محفوظة</footer>
</body>
</html>
