openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: ساعدني - API specification for the Oman help marketplace
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: users
    description: User operations
  - name: requests
    description: Help request operations
  - name: admin
    description: Admin operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user (returns OTP, does NOT log in)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: User registered, OTP generated for verification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "400":
          description: Bad request

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Request OTP login for a selected account type
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: OTP generated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OtpRequestResponse"
        "404":
          description: Phone not found

  /auth/admin-login:
    post:
      operationId: adminLogin
      tags: [auth]
      summary: Admin login with phone + PIN (no OTP)
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminLoginInput"
      responses:
        "200":
          description: Logged in as admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "403":
          description: Invalid PIN
        "404":
          description: Phone not found

  /auth/verify-otp:
    post:
      operationId: verifyOtp
      tags: [auth]
      summary: Verify OTP and complete login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyOtpInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Invalid or expired OTP
        "403":
          description: Account disabled

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"

  /service-areas:
    get:
      operationId: listServiceAreas
      tags: [users]
      summary: List active Muscat service areas
      responses:
        "200":
          description: Active service areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ServiceArea"

  /users/area-counts:
    get:
      operationId: listUserAreaCounts
      tags: [users]
      summary: List admin user counts by service area
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [all, active, blocked]
            default: all
      responses:
        "200":
          description: User counts by active service area
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAreaCounts"
        "403":
          description: Admin access required

  /requests:
    get:
      operationId: listRequests
      tags: [requests]
      summary: List help requests
      parameters:
        - name: category
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
        - name: customerId
          in: query
          schema:
            type: integer
        - name: helperId
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: List of requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a new help request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "400":
          description: Bad request

  /requests/{id}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Get a specific help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "404":
          description: Not found
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update a help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HelpRequestUpdate"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "404":
          description: Not found
    delete:
      operationId: deleteRequest
      tags: [requests]
      summary: Archive a help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Archived

  /requests/{id}/status:
    patch:
      operationId: updateRequestStatus
      tags: [requests]
      summary: Helper updates request status (in_progress / completed)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequestStatusInput"
      responses:
        "200":
          description: Updated request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "400":
          description: Invalid status transition
        "404":
          description: Not found

  /requests/{id}/accept:
    patch:
      operationId: acceptRequest
      tags: [requests]
      summary: Helper accepts a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AcceptRequestInput"
      responses:
        "200":
          description: Request accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "400":
          description: Already accepted
        "404":
          description: Not found

  /requests/{id}/complete:
    patch:
      operationId: completeRequest
      tags: [requests]
      summary: Atomically complete a request, record help feedback, and optionally rate the contacted helper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestCompletionInput"
      responses:
        "200":
          description: Completed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "400":
          description: Request cannot be completed
        "403":
          description: Not allowed
        "404":
          description: Not found

  /requests/{id}/contact:
    post:
      operationId: recordRequestContact
      tags: [requests]
      summary: Record an authorized helper contact attempt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestContactInput"
      responses:
        "200":
          description: Contact recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestContact"
        "403":
          description: Helper is not authorized to contact this request
        "404":
          description: Request or customer not found

  /requests/{id}/contacted-helpers:
    get:
      operationId: listContactedHelpers
      tags: [requests]
      summary: List helpers who contacted a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Authorized contacted helpers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContactedHelper"
        "403":
          description: Only the request owner or an administrator may view contact numbers

  /requests/{id}/cancel:
    patch:
      operationId: cancelRequest
      tags: [requests]
      summary: Customer cancels a request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "404":
          description: Not found

  /users:
    get:
      operationId: listUsers
      tags: [users]
      summary: List users (admin)
      parameters:
        - name: userType
          in: query
          schema:
            type: string
        - name: area
          in: query
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
        - name: includeNoArea
          in: query
          schema:
            type: boolean
        - name: search
          in: query
          schema:
            type: string
        - name: isActive
          in: query
          schema:
            type: boolean
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"

  /users/{id}:
    get:
      operationId: getUser
      tags: [users]
      summary: Get user by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: User
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "404":
          description: Not found
    patch:
      operationId: updateUser
      tags: [users]
      summary: Update a user
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/stats:
    get:
      operationId: getAdminStats
      tags: [admin]
      summary: Get admin dashboard stats
      responses:
        "200":
          description: Admin statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStats"

  /admin/statistics:
    get:
      operationId: getAdminStatistics
      tags: [admin]
      summary: Aggregate administrator dashboard metrics
      parameters:
        - {name: period, in: query, schema: {type: string, enum: [7d, 30d, month, all]}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - name: area
          in: query
          style: form
          explode: true
          schema: {type: array, items: {type: string}}
        - {name: category, in: query, schema: {type: string}}
      responses:
        "200":
          description: Aggregate statistics
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminStatistics"}
        "400": {description: Invalid filters}
        "401": {description: Authentication required}
        "403": {description: Admin required}

  /admin/requests/active:
    get:
      operationId: listAdminActiveRequests
      tags: [admin]
      summary: List active requests for administrators
      parameters:
        - {name: area, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: category, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Active requests page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminActiveRequestsResponse"}

  /admin/requests/archive:
    get:
      operationId: listAdminArchiveRequests
      tags: [admin]
      summary: List completed requests for administrators
      parameters:
        - {name: area, in: query, style: form, explode: true, schema: {type: array, items: {type: string}}}
        - {name: result, in: query, schema: {type: string, enum: [helped, not_helped, all]}}
        - {name: category, in: query, schema: {type: string}}
        - {name: search, in: query, schema: {type: string}}
        - {name: from, in: query, schema: {type: string, format: date-time}}
        - {name: to, in: query, schema: {type: string, format: date-time}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
      responses:
        "200":
          description: Completed requests page
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AdminArchiveRequestsResponse"}

  /admin/requests/deleted:
    get:
      operationId: listDeletedRequests
      tags: [admin]
      summary: List archived help requests
      responses:
        "200":
          description: Archived requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/HelpRequest"
        "401":
          description: Authentication required
        "403":
          description: Admin required

  /admin/requests/{id}/history:
    get:
      operationId: listRequestLifecycleEvents
      tags: [admin]
      summary: List request lifecycle audit history
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Request lifecycle history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/RequestLifecycleEvent"
        "401":
          description: Authentication required
        "403":
          description: Admin required
        "404":
          description: Not found

  /admin/requests/{id}/restore:
    post:
      operationId: restoreRequest
      tags: [admin]
      summary: Restore an archived help request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Restored request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HelpRequest"
        "400":
          description: Request is not archived
        "401":
          description: Authentication required
        "403":
          description: Admin required
        "404":
          description: Not found

  /admin/helpers/{id}/verify:
    patch:
      operationId: verifyHelper
      tags: [admin]
      summary: Approve or block a helper
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VerifyHelperInput"
      responses:
        "200":
          description: Helper updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"

  /admin/users/{id}/delete:
    delete:
      operationId: deleteUser
      tags: [admin]
      summary: Delete or anonymize a user without changing historical records
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirmation]
              properties:
                confirmation:
                  type: string
                  enum: [حذف]
      responses:
        "200":
          description: Deleted or anonymized
          content:
            application/json:
              schema:
                type: object
                required: [deletionMode]
                properties:
                  deletionMode:
                    type: string
                    enum: [permanent, anonymized]

  /admin/notifications:
    get:
      operationId: getAdminNotifications
      tags: [admin]
      summary: Get all admin notifications
      responses:
        "200":
          description: List of admin notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminNotification"

  /admin/notifications/{id}/read:
    patch:
      operationId: markNotificationRead
      tags: [admin]
      summary: Mark a notification as read
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminNotification"
        "404":
          description: Not found

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success

    User:
      type: object
      required: [id, name, phone, userType, createdAt, isActive]
      properties:
        id:
          type: integer
        name:
          type: string
        phone:
          type: string
        userType:
          type: string
          enum: [customer, helper, admin]
        area:
          type: ["string", "null"]
        rating:
          type: ["number", "null"]
        ratingCount:
          type: integer
          minimum: 0
          description: Count calculated from helper_ratings; not a client-maintained counter.
        isActive:
          type: boolean
        isVerified:
          type: boolean
        isBlocked:
          type: boolean
        deletedAt:
          type: ["string", "null"]
          format: date-time
        lastLogin:
          type: ["string", "null"]
        otpCode:
          type: ["string", "null"]
        otpCreatedAt:
          type: ["string", "null"]
        helperWelcomeMessageSentAt:
          type: ["string", "null"]
        createdAt:
          type: string
        helperInterests:
          type: ["string", "null"]
        preferredAreas:
          type: ["string", "null"]
        serviceAreas:
          type: array
          items:
            type: string

    RegisterInput:
      type: object
      required: [name, phone, userType]
      properties:
        name:
          type: string
        phone:
          type: string
        userType:
          type: string
          enum: [customer, helper]
        area:
          type: ["string", "null"]
        preferredAreas:
          type: array
          items:
            type: string

    LoginInput:
      type: object
      required: [phone, userType]
      properties:
        phone:
          type: string
        userType:
          type: string
          enum: [customer, helper]

    VerifyOtpInput:
      type: object
      required: [phone, otp]
      properties:
        phone:
          type: string
        otp:
          type: string

    AdminLoginInput:
      type: object
      required: [phone, pin]
      properties:
        phone:
          type: string
        pin:
          type: string

    OtpRequestResponse:
      type: object
      required: [message]
      properties:
        message:
          type: string
        otp:
          type: string
        isVerified:
          type: boolean
        isAdmin:
          type: boolean
        otpDelivery:
          type: string
          enum: [whatsapp]

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    UserUpdate:
      type: object
      properties:
        name:
          type: string
        area:
          type: string
        isActive:
          type: boolean
        helperInterests:
          type: ["string", "null"]
        preferredAreas:
          type: ["string", "null"]
        serviceAreas:
          type: array
          items:
            type: string

    HelpRequest:
      type: object
      required: [id, customerId, category, details, area, timeType, offeredAmount, status, createdAt]
      properties:
        id:
          type: integer
        customerId:
          type: integer
        helperId:
          type: ["integer", "null"]
        category:
          type: string
          enum: [transport, delivery, government, shopping, home_services, labor]
        details:
          type: string
        area:
          type: string
        timeType:
          type: string
          enum: [now, scheduled]
        scheduledDateTime:
          type: ["string", "null"]
        offeredAmount:
          type: number
        status:
          type: string
          enum: [available, accepted, in_progress, completed, cancelled]
        helpCompleted:
          type: ["boolean", "null"]
        completedHelperId:
          type: ["integer", "null"]
        completedAt:
          type: ["string", "null"]
        deletedAt:
          type: ["string", "null"]
        deletedByUserId:
          type: ["integer", "null"]
        deletedReason:
          type: ["string", "null"]
        createdAt:
          type: string
        customerName:
          type: ["string", "null"]
        customerPhone:
          type: ["string", "null"]
        helperName:
          type: ["string", "null"]
        helperPhone:
          type: ["string", "null"]

    HelpRequestInput:
      type: object
      required: [customerId, category, details, area, timeType, offeredAmount]
      properties:
        customerId:
          type: integer
        category:
          type: string
          enum: [transport, delivery, government, shopping, home_services, labor]
        details:
          type: string
        area:
          type: string
        timeType:
          type: string
          enum: [now, scheduled]
        scheduledDateTime:
          type: string
        offeredAmount:
          type: number

    HelpRequestUpdate:
      type: object
      properties:
        category:
          type: string
        details:
          type: string
        area:
          type: string
        timeType:
          type: string
        scheduledDateTime:
          type: string
        offeredAmount:
          type: number
        status:
          type: string

    AcceptRequestInput:
      type: object
      required: [helperId]
      properties:
        helperId:
          type: integer

    UpdateRequestStatusInput:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [in_progress, completed, cancelled]

    RequestCompletionInput:
      type: object
      description: >
        Completion is one transaction. When helpCompleted is true,
        completedHelperId must identify a helper in the request's contacted-helper
        summary and ratingStars may be supplied once. When helpCompleted is false,
        no helper or rating is recorded.
      properties:
        helpCompleted:
          type: boolean
        completedHelperId:
          type: ["integer", "null"]
        ratingStars:
          type: ["integer", "null"]
          minimum: 1
          maximum: 5

    ServiceArea:
      type: object
      required: [name, governorate, isActive, sortOrder]
      properties:
        name:
          type: string
        governorate:
          type: string
        isActive:
          type: boolean
        sortOrder:
          type: integer

    UserAreaCount:
      type: object
      required: [area, helperCount, customerCount]
      properties:
        area:
          type: string
        helperCount:
          type: integer
          minimum: 0
        customerCount:
          type: integer
          minimum: 0

    UserAreaCounts:
      type: object
      required: [areas, totalHelperCount, totalCustomerCount, noAreaHelperCount, noAreaCustomerCount]
      properties:
        areas:
          type: array
          items:
            $ref: "#/components/schemas/UserAreaCount"
